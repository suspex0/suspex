syntax = "proto3";

package suspex;

// Single agent control plane. Every non-streaming response embeds OpStatus;
// streaming RPCs carry OpStatus in the first (header) message of the stream.
// v1 targets x64 only; addr_width fields are carried so the wire contract
// already supports a future x86/WOW64 mode.

message OpStatus {
  bool ok = 1;
  string error = 2;
  uint32 errno_code = 3;
}

// ---------------------------------------------------------------- Agent ----

enum DriverState {
  DRIVER_ABSENT = 0;
  DRIVER_SERVICE = 1;
  DRIVER_MANUAL_MAPPED = 2;
}

message StatusRequest {}
message StatusResponse {
  OpStatus status = 1;
  string agent_version = 2;
  string os_version = 3;
  uint32 os_build = 4;
  bool testsigning = 5;
  bool hvci = 6;
  bool secureboot = 7;
  DriverState driver_state = 8;
  string driver_version = 9;
  bool patchguard_expected = 10;
  // v7: milliseconds since the agent process started. 0 on pre-v7 agents.
  // target_manage(action='crash_state') diff's this vs the last successful
  // call's wall-clock to detect a mid-session reboot.
  uint64 agent_uptime_ms = 11;
  // v14: unix-ms of the last system boot (derived from GetTickCount64) and a
  // random per-agent-process id. Lets an orchestrator tell "same machine,
  // new boot" apart from "same boot, agent restarted" without diffing
  // uptimes by hand. 0/"" on agents that predate the fields.
  uint64 boot_epoch_ms = 12;
  string agent_instance_id = 13;
  // v1.0.1 Phase 2.1: network identity echo. Lets the orchestrator
  // self-heal machine endpoints when DHCP moves the box — the IPs the
  // agent sees are authoritative where ARP/mDNS/getaddrinfo lie. Empty
  // on agents that predate the field.
  repeated AdapterInfo ipv4 = 14;
}

// v1.0.1 Phase 2.1: one entry per IPv4 unicast address learned via
// GetAdaptersAddresses. The orchestrator uses this both for the registry
// observed_endpoints self-heal and for the Phase 2.4 rediscover MAC-filter
// path.
message AdapterInfo {
  string adapter      = 1; // FriendlyName, e.g. "Ethernet 2"
  string address      = 2; // dotted IPv4
  uint32 prefix_len   = 3; // 0..32
  string origin       = 4; // "dhcp" | "static" | "unknown"
  string gateway      = 5; // first default gateway IPv4 on this adapter, else ""
  string mac          = 6; // "aa:bb:cc:dd:ee:ff"
  bool   up           = 7; // operational status (IfOperStatusUp)
}

message DriverLoadRequest {
  enum Method {
    SERVICE = 0;      // test-signed service via SCM (NtLoadDriver path)
    MANUAL_MAP = 1;   // custom mapper exe; HVCI must be off
  }
  Method method = 1;
  string image_path = 2;   // default: agent install dir suspex_driver.sys
  string mapper_path = 3;  // manual map only, default: agent dir mapper.exe
}
message DriverUnloadRequest {
  bool delete_service = 1; // service path: stop + delete (reboot fallback documented)
}

// Bounce-and-swap a service binary on the target. The agent generates and
// detached-spawns an on-target .cmd that stops the service, force-kills any
// leftover process holding the old image, moves the live exe aside into
// prev\, promotes the staged upload, restarts the service, health-checks the
// listen port, and rolls back on failure. Works for the agent itself
// (SuspexAgent) and the umagent (SuspexUmagent).
message SelfUpdateRequest {
  string service_name = 1;  // SuspexAgent | SuspexUmagent
  string exe_path = 2;      // live binary, e.g. C:\suspex\suspex_agent.exe
  string staged_path = 3;   // uploaded replacement, e.g. ...\suspex_agent.new
  string sha256 = 4;        // optional: refuse swap if staged file mismatches
  string listen_port = 5;   // health check after restart (e.g. "50074")
}

// v5: agent-side crash breadcrumb — the driver op ring persisted to
// %ProgramData%\suspex\breadcrumb.bin. Survives an agent restart, so a
// caller can ask "what was in flight when you died" and get an answer
// even after SCM burned its 3-restart budget. The in-memory ring holds
// the current run's calls; on startup the agent replays the last
// on-disk snapshot from the previous run into `prior_ops`.
message RecentOpsRequest {
  uint32 limit = 1;      // 0 -> full ring (64)
  bool include_prior = 2; // include ops from the previous agent lifetime
}
message BreadcrumbOp {
  uint64 t_start_us = 1; // monotonic microseconds since agent start
  uint64 t_end_us = 2;   // 0 if still pending / never completed
  uint32 ioctl_code = 3; // SUSPEX_IOCTL_*
  string arg_summary = 4;
  uint32 status_code = 5; // NTSTATUS or GLE
  string status_kind = 6; // "pending" | "ok" | "error" | "wedged"
  uint64 latency_us = 7;  // t_end - t_start when known
}
message RecentOpsResponse {
  OpStatus status = 1;
  repeated BreadcrumbOp current = 2; // this agent lifetime
  repeated BreadcrumbOp prior = 3;   // from the last shutdown snapshot (agent's prior run)
  uint64 agent_start_epoch_ms = 4;
  uint64 now_epoch_ms = 5;
}

// v8: broad target-machine fingerprint. Status stays cheap and answers the
// "can I load the driver?" question; HostInfo answers "what am I running
// on?" — identity (user/computer/domain), full OS release (product name,
// display version, UBR), security posture (secure boot, VBS, driver
// blocklist, LSA-PPL, CPU features, kernel debugger), and optionally
// hardware and installed security products. All reads are observational —
// no writes and no touch of the analyst-host defensive posture (see
// docs/REVERSEKIT_REVIEW.md scope discipline).
message HostInfoRequest {
  bool include_security_products = 1; // WSC enum (may need SYSTEM); empty on failure
  bool include_hardware = 2;          // CPUID + phys mem + hypervisor tag
}
message SecurityProduct {
  string name = 1;
  string state = 2;    // "on" | "off" | "expired" | "snoozed" | "unknown"
  string version = 3;
  string kind = 4;     // "av" | "firewall" | "antispyware"
}
message HostInfoResponse {
  OpStatus status = 1;

  // ---- Identity (driver-free, cheap) ----
  string computer_name       = 2;  // GetComputerNameExW(NetBIOS)
  string dns_hostname        = 3;  // GetComputerNameExW(DnsFullyQualified)
  string domain              = 4;  // joined domain / workgroup
  string logged_on_user      = 5;  // active console session user (WTSGetActiveConsoleSessionId)
  string agent_run_as        = 6;  // whoever the agent process is running as
  bool   is_elevated         = 7;  // agent token elevation

  // ---- OS ----
  string product_name        = 10; // "Windows 11 Pro" (registry ProductName)
  string edition_id          = 11; // "Professional"  (registry EditionID)
  string display_version     = 12; // "25H2"          (registry DisplayVersion)
  string release_id          = 13; // "2609"          (registry ReleaseId)
  uint32 build_major         = 14; // 26200           (RtlGetVersion)
  uint32 build_ubr           = 15; // 9186            (registry UBR)
  string full_build_string   = 16; // convenience: "26200.9186"
  string install_date        = 17; // ISO8601 from registry InstallDate
  string boot_time           = 18; // ISO8601 (now - GetTickCount64)
  string timezone            = 19; // dynamic timezone key name
  string arch                = 20; // "x64" | "arm64" | "wow64"

  // ---- Security posture ----
  // For each flag: `<name>_source` is "driver" (verified by loaded driver),
  // "registry" (usermode registry read), "api" (Nt/Win32 API), "unknown" (probe
  // failed). The orchestrator wraps this into the {value, confidence, note}
  // envelope for LLM consumption; callers get the raw pair here.
  bool testsigning           = 30;
  string testsigning_source  = 31;
  bool hvci                  = 32;
  string hvci_source         = 33;
  bool secureboot            = 34;
  string secureboot_source   = 35;
  bool kernel_debugger       = 36; // NtQuerySystemInformation(KernelDebuggerInformation)
  string kernel_debugger_source = 37;
  bool vbs_enabled           = 38;
  string vbs_source          = 39;
  bool credential_guard      = 40;
  string credential_guard_source = 41;
  bool driver_blocklist_on   = 42; // HKLM\...\CI\Config\VulnerableDriverBlocklistEnable
  string driver_blocklist_source = 43;
  bool lsa_protected         = 44; // HKLM\...\Lsa\RunAsPPL
  string lsa_protected_source = 45;
  bool smep                  = 46;
  bool smap                  = 47;
  bool cet_shstk             = 48;
  string patchguard_state    = 49; // "expected" | "kd_disables_pg" | "unknown"
  // v0.13: Kernel VA Shadow (Meltdown mitigation) — bit 0 of the
  // SYSTEM_KERNEL_VA_SHADOW_INFORMATION dword returned by
  // NtQuerySystemInformation(SystemKernelVaShadowInformation=196).
  bool   kva_shadow          = 50;
  string kva_shadow_source   = 51;

  // ---- Hardware (optional; empty when include_hardware=false) ----
  string cpu_brand           = 60;
  uint32 cpu_cores           = 61; // physical cores
  uint32 cpu_logical         = 62; // logical processors
  uint64 phys_mem_bytes      = 63;
  string hypervisor_vendor   = 64; // "Microsoft Hv" | "VMwareVMware" | "KVMKVMKVM" | "VBoxVBoxVBox" | ""
  bool   is_vm               = 65;

  // ---- Uptime ----
  uint64 pc_uptime_ms        = 66; // GetTickCount64() — since last cold/warm boot
  uint64 agent_uptime_ms     = 67; // current suspex_agent process lifetime
  uint64 service_uptime_ms   = 68; // suspex_agent service lifetime per SCM (0 if not
                                   // running as a service or SCM query fails)

  // ---- Security products (optional) ----
  repeated SecurityProduct security_products = 70;

  // ---- Collector diagnostics — one string per probe that failed, so the
  // orchestrator can render honest "we couldn't check X" gaps instead of
  // silently reporting a default value as truth.
  repeated string probe_errors = 90;

  // ---- v1.0.1 Phase 2.1: network identity echo. The IPv4 unicast
  // addresses the agent sees via GetAdaptersAddresses — the orchestrator
  // compares these to its last-known endpoint to detect NIC flaps and
  // feeds the rediscover candidate list.
  repeated AdapterInfo ipv4 = 95;
}

// ------------------------- Static IPv4 pin (v1.0.1 Phase 2.2) ----
// Deploy-time wiring reads/sets the agent's pinned adapter via the agent
// config file; this RPC lets an orchestrator inspect current state and
// (optionally) trigger a one-shot re-pin without a service restart.
message NetPinStatusRequest {}
message NetPinStatusResponse {
  OpStatus status = 1;
  bool enabled = 2;             // config-level enable
  bool hold = 3;                // SUSPEX_NET_PIN_HOLD marker is set
  string adapter = 4;           // configured FriendlyName
  string pinned_address = 5;    // configured static IPv4
  uint32 pinned_prefix = 6;
  string pinned_gateway = 7;
  string current_address = 8;   // what the adapter currently has
  uint64 last_pin_at_epoch_ms = 9;
  uint32 pin_attempts = 10;
  uint32 pin_failures_streak = 11;
  string last_error = 12;
}
message NetPinApplyRequest {
  bool clear_hold = 1;          // drop the hold marker then re-pin
}
message NetPinApplyResponse {
  OpStatus status = 1;
  bool applied = 2;
  string details = 3;
}

service NetPin {
  rpc Status(NetPinStatusRequest) returns (NetPinStatusResponse); // v1.0.1 2.2
  rpc Apply(NetPinApplyRequest) returns (NetPinApplyResponse);    // one-shot re-pin
}

// ------------------------------------------------------- Screen / UI (v15) ----
//
// Visual inspection of the interactive desktop. The Session-0 service cannot
// see user-desktop windows (EnumWindows is window-station scoped), so every
// capture / enumeration runs in a short-lived re-launch of the agent binary
// inside the active console session (CreateProcessAsUserW + --screenshot) and
// ships results back over an anonymous pipe (screen_common.hpp wire header).

message WindowRect {
  int32 x = 1;
  int32 y = 2;
  int32 width = 3;
  int32 height = 4;
}

message WindowDetail {
  uint64 hwnd = 1;              // HWND cast to uint64
  string title = 2;
  WindowRect rect = 3;          // WINDOWINFO.rcWindow
  bool is_foreground = 4;
  bool is_minimized = 5;
  int32 z_order = 6;            // EnumWindows order, 0 = top-most
  // ---- v15 detailed metadata (populated when include_details, default
  // true); mirrors the JSON keys emitted by window_enum.cpp 1:1 ----
  string class_name = 7;        // GetClassNameW
  WindowRect client_rect = 8;   // WINDOWINFO.rcClient
  uint32 style = 9;             // WINDOWINFO.dwStyle
  uint32 exstyle = 10;          // WINDOWINFO.dwExStyle
  uint32 window_status = 11;    // WINDOWINFO.dwWindowStatus
  uint32 border_cx = 12;        // WINDOWINFO.cxWindowBorders
  uint32 border_cy = 13;        // WINDOWINFO.cyWindowBorders
  uint32 show_cmd = 14;         // WINDOWPLACEMENT.showCmd (1=normal 2=min 3=max)
  WindowRect normal_pos = 15;   // WINDOWPLACEMENT.rcNormalPosition
  uint64 parent = 16;           // WINDOWINFO.hwndParent
  uint64 owner = 17;            // GetWindow(hwnd, GW_OWNER)
  uint32 pid = 18;
  uint32 tid = 19;
  string process_path = 20;     // QueryFullProcessImageNameW ("" if denied)
  uint64 hinstance = 21;        // GetWindowLongPtrW(GWL_HINSTANCE)
  bool visible = 22;            // IsWindowVisible
  bool enabled = 23;            // IsWindowEnabled
  bool maximized = 24;          // IsZoomed
  bool topmost = 25;            // WS_EX_TOPMOST
  bool layered = 26;            // WS_EX_LAYERED
  bool tool_window = 27;        // WS_EX_TOOLWINDOW
  bool cloaked = 28;            // DWMWA_CLOAKED (UWP suspended etc.)
  uint32 dpi = 29;              // GetDpiForWindow (worker is per-monitor-v2 aware)
  uint32 window_type_atom = 30; // WINDOWINFO.atomWindowType
}

message ProcessWindowGroup {
  uint32 pid = 1;
  string process_name = 2;
  repeated WindowDetail windows = 3;
}

message ScreenCaptureRequest {
  string mode = 1;             // "desktop" | "window" | "list" | "displays"
  string display_id = 2;       // desktop mode: "" (primary), "1", or "DISPLAY1"
  uint64 hwnd = 3;             // window mode: exact HWND (else pid/title/process_name)
  uint32 pid = 4;              // window mode: topmost visible window of pid; list mode: filter
  string window_title = 5;     // window mode: substring match (resolved in the worker)
  uint32 max_dimension = 6;    // orchestrator-side only; the agent captures native
  string format = 7;           // "png"
  bool include_windows = 8;    // carry window telemetry JSON in the capture response
  bool include_hidden = 9;     // false (default) = visible windows only
  bool include_details = 10;   // full per-window metadata (default true)
  string process_name = 11;    // window mode: topmost window of this exe; list mode: filter
  string query = 12;           // list mode: substring across window titles/classes
}

message ScreenCaptureResponse {
  OpStatus status = 1;
  bytes image_data = 2;        // in-memory PNG bytes (empty for list/displays)
  string target_type = 3;      // "desktop" | "window" | "displays" | "list"
  string target_name = 4;      // e.g. "DISPLAY1" or "notepad.exe"
  uint32 width = 5;
  uint32 height = 6;
  uint64 timestamp_unix_ms = 7;
  string windows_json = 8;     // raw worker telemetry JSON (processes/displays)
}

message WindowListRequest {
  uint32 pid = 1;              // 0 = all
  string process_name = 2;     // filter by exe name (e.g. "cmd.exe")
  string query = 3;            // substring search across window titles/classes
  bool include_hidden = 4;     // false (default) = visible windows only
  bool include_details = 5;    // full metadata per window (default true)
}

message WindowListResponse {
  OpStatus status = 1;
  string windows_json = 2;     // authoritative payload from the session-1 worker
  uint32 total_windows = 3;    // parsed orchestrator-side
}

service Agent {
  rpc Status(StatusRequest) returns (StatusResponse);
  rpc DriverLoad(DriverLoadRequest) returns (OpStatus);
  rpc DriverUnload(DriverUnloadRequest) returns (OpStatus);
  rpc SelfUpdate(SelfUpdateRequest) returns (OpStatus);
  rpc RecentOps(RecentOpsRequest) returns (RecentOpsResponse);
  rpc HostInfo(HostInfoRequest) returns (HostInfoResponse);
  rpc CaptureScreen(ScreenCaptureRequest) returns (ScreenCaptureResponse);
  rpc ListWindows(WindowListRequest) returns (WindowListResponse);
}

// --------------------------------------------------------------- Memory ----

enum MemSpace {
  USER = 0;
  KERNEL = 1;
  PHYSICAL = 2;
}

message MemoryReadRequest {
  uint32 pid = 1;          // ignored for KERNEL/PHYSICAL
  uint64 address = 2;
  uint64 size = 3;         // capped by agent config (default 8 MiB per call)
  MemSpace space = 4;
  uint32 addr_width = 5;   // 64 default, 32 reserved
  bool allow_fault = 6;    // kernel space: permit driver soft-fault of
                           // non-resident PAGEDATA (default: fail cleanly)
  bool partial = 7;        // v6 kernel space: per-4KB walk, stop at first
                           // unmapped page and return the valid prefix
                           // (STATUS_PARTIAL_COPY). Kills the "1 MB chunk
                           // fails atomically on one bad page" workflow.
  uint64 max_bytes = 10;   // v9: driver-side hard byte cap independent of `size`
                           // (0 = uncapped; when set, clips to min(size, max_bytes))
}
message MemoryReadResponse {
  OpStatus status = 1;
  bytes data = 2;
  uint64 read_bytes = 3;
  uint64 first_bad_offset = 4;  // v6, partial=true only: bytes into the
                                 // request where the walk stopped (== data.size()
                                 // when a hole was hit; 0 when the whole range
                                 // succeeded).
}

message MemoryWriteRequest {
  uint32 pid = 1;
  uint64 address = 2;
  bytes data = 3;
  MemSpace space = 4;
  uint32 addr_width = 5;
  bool allow_map_write = 6; // physical space: opt into the driver's
                            // MmMapIoSpaceEx write path (ABI v5). Default
                            // refused; unmappable pages surface as
                            // written_bytes < len(data), not an error.
  // v12: 0 = current/system CR3. Nonzero writes through the caller-supplied
  // address space (kernel space only; the driver verifies the target CR3
  // shares the kernel half before swapping).
  uint64 cr3 = 7;
  // v12: SUSPEX_MEM_WRF_* bits. Bit0 STRICT_VA: a kernel write faults on
  // the direct VA path -> STATUS_INVALID_ADDRESS, never the phys-remap
  // fallback (fallback silently bypasses linear-address watchpoints).
  uint32 flags = 8;
}
message MemoryWriteResponse {
  OpStatus status = 1;
  uint64 written_bytes = 2;
  // v12: which store path ran. 0 unknown (pre-v12 agent/driver),
  // 1 direct_va (the target linear VA), 2 phys_remap (page-table walk +
  // physical map — DR watchpoints on the linear address did NOT see this
  // store), 3 foreign_cr3 (direct VA under the request's cr3).
  uint32 write_path = 3;
}

message MemoryAllocRequest {
  uint32 pid = 1;          // user-mode allocation
  bool kernel = 2;         // true: pool alloc in kernel, pid ignored
  uint64 size = 3;
  uint32 protect = 4;      // Win32 PAGE_* constant, user-mode only
  uint32 addr_width = 5;
}
message MemoryAllocResponse {
  OpStatus status = 1;
  uint64 address = 2;
}

message MemoryFreeRequest {
  uint32 pid = 1;
  bool kernel = 2;
  uint64 address = 3;
}
message MemoryFreeResponse { OpStatus status = 1; }

message MemoryProtectRequest {
  uint32 pid = 1;
  uint64 address = 2;
  uint64 size = 3;
  uint32 protect = 4;
  uint32 addr_width = 5;
}
message MemoryProtectResponse {
  OpStatus status = 1;
  uint32 old_protect = 2;
}

message ModuleInfo {
  string name = 1;
  string path = 2;
  uint64 base = 3;
  uint64 size = 4;
  bool kernel = 5;
}
message ModulesRequest {
  uint32 pid = 1;
  bool kernel = 2;         // true: PsLoadedModuleList walk, pid ignored
  int32 limit = 3;         // v9: 0 = no cap; agent slices response
  int32 offset = 4;
}
message ModulesResponse {
  OpStatus status = 1;
  repeated ModuleInfo modules = 2;
}

message PatternScanRequest {
  uint32 pid = 1;
  uint64 base = 2;         // 0 = scan all committed user space of pid
  uint64 size = 3;         // 0 = till end of region chain
  bytes pattern = 4;
  string mask = 5;         // '?' wildcard, len == pattern length; empty = exact.
                          // v0.27: the wire mask is byte-granular; nibble
                          // wildcards from pattern tokens ('6?'/'?F') are
                          // compiled to '?' client-side and candidates are
                          // post-verified via mem_read.
  MemSpace space = 6;      // USER default; KERNEL supported (driver read path)
  uint32 max_results = 7;  // default 64
}
message PatternScanResponse {
  OpStatus status = 1;
  repeated uint64 addresses = 2;
}

// v0.16 (ABI v10): server-streaming pattern scan. Solves the 16 GB
// kernel-scan blowing the MCP deadline: chunks come back as they land
// and the orchestrator can tear down the stream mid-scan.
message PatternScanChunk {
  OpStatus status = 1;
  repeated uint64 addresses = 2;   // matches accumulated in THIS chunk
  uint64 bytes_scanned = 3;        // running total since scan_start
  uint64 cursor = 4;               // current VA at chunk emission
  bool done = 5;                   // final chunk (success, cap, or early stop)
}

message VadEntry {
  uint64 start = 1;          // inclusive VA
  uint64 end = 2;            // exclusive VA
  uint32 protect = 3;        // Win32 PAGE_* (guard/nocache variants included)
  uint32 vad_type = 4;
  uint64 commit_charge = 5;
}
message VadRequest {
  uint32 pid = 1;
  int32 limit = 2;         // v9: 0 = no cap
  int32 offset = 3;
}
message VadResponse {
  OpStatus status = 1;
  repeated VadEntry entries = 2;
}

message HandleEntry {
  uint64 object = 1;
  uint64 handle = 2;
  uint32 granted_access = 3;
  uint32 type_index = 4;
  string type_name = 5;
  string name = 6;           // only when want_names (File objects stay unnamed)
}
message HandleListRequest {
  uint32 pid = 1;
  bool want_names = 2;       // slow: resolves object names
  int32 limit = 3;           // v9: 0 = no cap
  int32 offset = 4;
}
message HandleListResponse {
  OpStatus status = 1;
  repeated HandleEntry handles = 2;
}

message ProcessInfo {
  uint32 pid = 1;
  uint32 parent_pid = 2;
  string image_name = 3;
  // v14: usermode enrichment (NtQuerySystemInformation(SystemProcessInfo))
  // — present even when the driver is absent, which is exactly when the
  // caller most needs process discovery. cmdline is empty on protected/PPL
  // processes and when the request didn't opt in.
  string cmdline = 4;
  uint64 create_time_100ns = 5;  // FILETIME ticks since 1601 (SPI CreateTime)
  uint32 session_id = 6;
}
message ListProcessesRequest {
  int32 limit = 1;           // v9: 0 = no cap
  int32 offset = 2;
  // v14: per-pid PEB cmdline walk (OpenProcess + ReadProcessMemory). Slower
  // on large lists and empty for protected processes — opt-in.
  bool with_cmdline = 3;
}
message ListProcessesResponse {
  OpStatus status = 1;
  repeated ProcessInfo processes = 2;
  // v14: which enumerator produced the rows — "agent" (NtQSI usermode,
  // no driver needed) or "driver" (last-ditch fallback). Callers use it
  // to gauge freshness/coverage.
  string source = 3;
}

message IatEntry {
  string dll = 1;              // declared source DLL from the import descriptor
  string name = 2;             // export name; empty when imported by ordinal
  uint32 ordinal = 3;          // valid iff name == "" (IMAGE_ORDINAL_FLAG set)
  uint64 iat_slot = 4;         // VA of the FirstThunk slot in the caller image
  uint64 resolved = 5;         // pointer currently in the slot
  string resolved_module = 6;  // module owning `resolved`, empty if none
  bool hooked = 7;             // basename(resolved_module) != basename(dll)
}
message ModuleImportsRequest {
  uint32 pid = 1;
  string module = 2;           // basename or full path
  bool kernel = 3;             // walk kernel view (pid ignored)
  int32 limit = 4;             // v9: 0 = no cap
  int32 offset = 5;
}
message ModuleImportsResponse {
  OpStatus status = 1;
  repeated IatEntry entries = 2;
}

message ExportEntry {
  string name = 1;
  uint32 ordinal = 2;
  uint64 rva = 3;
  uint64 address = 4;          // base + rva
  string forwarder = 5;        // e.g. "api-ms-...!Foo"; empty for regular exports
}
message ModuleExportsRequest {
  uint32 pid = 1;
  string module = 2;
  bool kernel = 3;
  int32 limit = 4;             // v9: 0 = no cap
  int32 offset = 5;
}
message ModuleExportsResponse {
  OpStatus status = 1;
  repeated ExportEntry entries = 2;
}

message HeapBlock {
  uint64 address = 1;
  uint64 size = 2;
  uint32 flags = 3;            // RTL_HEAP_ENTRY flags (BUSY/EXTRA/...)
}
message HeapEntry {
  uint64 handle = 1;           // HEAP* (target VA)
  uint32 flags = 2;
  uint64 base = 3;
  uint64 committed = 4;
  uint64 reserved = 5;
  repeated HeapBlock blocks = 6;   // populated iff want_blocks
}
message HeapListRequest {
  uint32 pid = 1;
  bool want_blocks = 2;
  uint32 max_blocks = 3;       // per-heap cap, 0 = 4096 default
}
message HeapListResponse {
  OpStatus status = 1;
  repeated HeapEntry heaps = 2;
}

// v4 additions: physical-range enumeration and kernel big-pool scan.
message PhysRangesRequest {
  int32 limit = 1;             // v9: 0 = no cap
  int32 offset = 2;
}
message PhysRangeEntry {
  uint64 base = 1;
  uint64 size = 2;
  uint32 kind = 3; // 0 = RAM (only kind currently produced)
}
message PhysRangesResponse {
  OpStatus status = 1;
  repeated PhysRangeEntry ranges = 2;
}

message PoolScanRequest {
  uint32 tag_filter = 1;   // 4-char tag packed LE as uint32, or 0 for any
  bool nonpaged_only = 2;
  bool paged_only = 3;
  uint32 max_results = 4;
  bytes pattern = 5;       // v1.0.1 Phase 3.2: raised to <=64 bytes
  bytes mask = 6;          // same length as pattern; 0 or '?' = wildcard byte
  uint32 offset = 7;       // start byte of the content window inside each entry
  uint32 content_span = 8; // v1.0.1 Phase 3.2: raised to <=64 KiB
  // v1.0.1 Phase 3.2: resumable scans. The response's next_cursor echoes
  // where the driver stopped; passing it back resumes from that entry
  // (0 = fresh scan). Needed to drive wide sweeps that would otherwise
  // blow max_results silently.
  uint32 cursor = 9;
}
message PoolBlock {
  uint64 virtual_address = 1;
  uint64 size_in_bytes = 2;
  uint32 tag = 3;
  string tag_ascii = 4;    // decoded 4-char pool tag for readability
  bool nonpaged = 5;
  uint64 matched_offset = 6; // absolute VA of the pattern hit, 0 when no content filter
}
message PoolScanResponse {
  OpStatus status = 1;
  repeated PoolBlock entries = 2;
  uint32 required = 3;    // total big-pool entries seen before filter
  uint32 considered = 4;  // after tag/paged filter, before content filter
  // v1.0.1 Phase 3.2: scan telemetry. holes counts entries where the
  // content read failed (previously silent `continue`); span_truncated
  // counts entries whose content span was clipped; last_index is the
  // driver's internal scan cursor; next_cursor is the resume point for
  // the next call (0 means the scan completed).
  uint32 holes = 5;
  uint32 span_truncated = 6;
  uint32 last_index = 7;
  uint32 next_cursor = 8;
}

// v5: server-streaming reads for >4 MiB ranges. Removes the manual-chunk
// dance for callers who want a single logical read (dxgkrnl image dump,
// full ranged pattern-scan seed, etc.). Reuses MemoryReadRequest; each
// chunk carries its own offset so a caller can reassemble streams that
// interleave under retries or reorder in transit.
message MemoryReadChunk {
  OpStatus status = 1;    // set on the first (and any error) chunk only
  uint64 offset = 2;      // bytes from start of the requested range
  bytes data = 3;         // <= server_chunk_bytes (default 1 MiB)
  bool eof = 4;           // set on the final chunk (data may still be non-empty)
}

// v7: VA -> PA translation via the driver's page-table walk. The
// SUSPEX_FUNC_VA_TRANSLATE IOCTL shipped in ABI v5 (drv_exerciser vatrans
// exercised it) but had no gRPC surface until v7. v12 adds USER space
// (pid -> KeStackAttachProcess -> process CR3) and a caller-supplied cr3
// override for foreign-address-space walks.
message VaTranslateRequest {
  MemSpace space = 1;   // KERNEL or USER (v12); PHYSICAL refused
  uint32 pid = 2;       // USER: process whose tables are walked; 0 = agent's
  uint64 va = 3;
  uint64 cr3 = 4;       // v12: explicit CR3 to walk under; 0 = resolved from
                        // space/pid (system CR3 for KERNEL, process CR3 for USER)
}
message VaTranslateResponse {
  OpStatus status = 1;
  uint64 pa = 2;
  bool present = 3;             // page mapped under the walked CR3
  uint64 cr3 = 4;               // CR3 the walk actually used (v12; 0 pre-v12)
  uint32 page_size_shift = 5;   // 12 (4 KiB), 21 (2 MiB), 30 (1 GiB); 0 unknown
}

// v12: per-CPU IDT dump. The driver __sidt's each requested processor and
// decodes KIDTENTRY64 rows itself — 256 x 16 B per CPU fits the out-buffer
// without an agent-side kernel read per entry. Row idt_base records the
// IDTR base of the CPU that row was read on (per-CPU tables differ; a
// drifted base is a detour signature for the caller to score).
message IdtListRequest {
  bool all_cpus = 1;      // false = the servicing CPU's IDT only
}
message IdtEntryRow {
  uint32 cpu = 1;         // processor index the row was read on
  uint32 vector = 2;
  uint64 handler_va = 3;  // decoded offset_lo|mid|hi
  uint32 selector = 4;
  uint32 ist = 5;
  uint32 dpl = 6;
  uint64 idt_base = 7;    // IDTR.Base of the CPU this row came from
}
message IdtListResponse {
  OpStatus status = 1;
  uint64 idt_base = 2;              // IDTR.Base of the first CPU read
  uint32 idt_limit = 3;             // its IDTR.Limit (typically 0xFFF)
  repeated IdtEntryRow entries = 4;
}

// v7: agent-side memory polling. The agent spawns one worker thread per
// active watch; each thread MemReads `length` bytes every `interval_ms`
// via the same routing as Memory.Read (user/kernel/physical), compares
// with the previous window, and emits a WatchEvent on transition. The
// worker terminates when duration_s elapses, max_events is reached, the
// client cancels the stream, the agent shuts down, or too many
// consecutive read failures accumulate. Agent-side cap on concurrent
// watches (config SUSPX_MAX_WATCHES, default 8) and an interval floor
// (config SUSPX_WATCH_MIN_MS, default 10 ms) so a runaway request cannot
// convert the target into a busy loop.
message WatchRequest {
  MemSpace space = 1;         // USER/KERNEL/PHYSICAL — same routing as Memory.Read
  uint32 pid = 2;             // USER only; 0 for KERNEL/PHYSICAL
  uint64 address = 3;
  uint32 length = 4;          // up to 256 bytes — small-object watcher
  uint32 interval_ms = 5;     // floor at server-side minimum (default 10 ms)
  uint32 duration_s = 6;      // 0 = server default (60 s), max cap enforced
  bytes expected_hex = 7;     // empty = report every change; non-empty = report
                              // only when the current value != expected. Length
                              // must match `length` when set.
  uint32 max_events = 8;      // 0 = unlimited (bounded by duration_s + agent cap)
  string tag = 9;             // free-form label surfaced in each event
}
message WatchEvent {
  OpStatus status = 1;        // set on the first message with ok=true, and on
                              // termination messages when the watch ended
                              // uncleanly (read fail, cap hit, etc.)
  uint64 seq = 2;             // 1-indexed
  uint64 ts_ms = 3;           // milliseconds since unix epoch
  bytes prev = 4;             // last known bytes (empty on the first sample)
  bytes now = 5;              // current bytes
  bool eof = 6;               // set on the final message
  string reason = 7;          // populated when eof=true: duration|max_events|
                              // read_failed|cancelled|agent_shutdown
  bool read_failed = 8;       // when true, `now` is empty (last MemRead failed)
}

service Memory {
  rpc Read(MemoryReadRequest) returns (MemoryReadResponse);
  rpc Write(MemoryWriteRequest) returns (MemoryWriteResponse);
  rpc Alloc(MemoryAllocRequest) returns (MemoryAllocResponse);
  rpc Free(MemoryFreeRequest) returns (MemoryFreeResponse);
  rpc Protect(MemoryProtectRequest) returns (MemoryProtectResponse);
  rpc Modules(ModulesRequest) returns (ModulesResponse);
  rpc Scan(PatternScanRequest) returns (PatternScanResponse);
  rpc ListProcesses(ListProcessesRequest) returns (ListProcessesResponse);
  rpc VadList(VadRequest) returns (VadResponse);
  rpc HandleList(HandleListRequest) returns (HandleListResponse);
  rpc ModuleImports(ModuleImportsRequest) returns (ModuleImportsResponse);
  rpc ModuleExports(ModuleExportsRequest) returns (ModuleExportsResponse);
  rpc HeapList(HeapListRequest) returns (HeapListResponse);
  rpc PhysicalRanges(PhysRangesRequest) returns (PhysRangesResponse);
  rpc PoolScan(PoolScanRequest) returns (PoolScanResponse);
  rpc ReadStream(MemoryReadRequest) returns (stream MemoryReadChunk);
  rpc VaTranslate(VaTranslateRequest) returns (VaTranslateResponse);          // v7
  rpc Watch(WatchRequest) returns (stream WatchEvent);                        // v7
  rpc ThreadList(ThreadListRequest) returns (ThreadListResponse);             // v11
  rpc ObjEnum(ObjEnumRequest) returns (ObjEnumResponse);                      // v11
  rpc IdtList(IdtListRequest) returns (IdtListResponse);                      // v12
  // v0.16 (ABI v10): cancellable server-streaming Scan. Legacy unary
  // Scan stays for the small whole-space calls. The chunk stream lets
  // the orchestrator tear down mid-scan without the agent's loop
  // continuing to sweep — the handler polls ctx->IsCancelled() between
  // chunks and returns immediately when the client disconnects.
  rpc ScanStream(PatternScanRequest) returns (stream PatternScanChunk);
}

// ---------------------------------------------------------------- Debug ----

message Registers {
  uint64 rax = 1;
  uint64 rcx = 2;
  uint64 rdx = 3;
  uint64 rbx = 4;
  uint64 rsp = 5;
  uint64 rbp = 6;
  uint64 rsi = 7;
  uint64 rdi = 8;
  uint64 r8 = 9;
  uint64 r9 = 10;
  uint64 r10 = 11;
  uint64 r11 = 12;
  uint64 r12 = 13;
  uint64 r13 = 14;
  uint64 r14 = 15;
  uint64 r15 = 16;
  uint64 rip = 17;
  uint32 rflags = 18;
  uint32 dr0 = 19;
  uint32 dr1 = 20;
  uint32 dr2 = 21;
  uint32 dr3 = 22;
  uint32 dr6 = 23;
  uint32 dr7 = 24;
  uint32 gs_base_low = 25;   // informational, read-only
  uint64 fs_base = 26;
  uint64 gs_base = 27;
}

message StepRequest {
  enum Kind {
    STEP_INTO = 0;
    STEP_OVER = 1;
  }
  Kind kind = 1;
  uint64 count = 2; // default 1
}
