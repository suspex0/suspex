message GetRegsRequest {}
message GetRegsResponse {
  OpStatus status = 1;
  Registers regs = 2;
}
message SetRegsRequest {
  Registers regs = 1;   // fields present != 0 are applied
  bool apply_rip = 2;
  bool apply_rflags = 3;
  bool apply_dr = 4;
  bool apply_gprs = 5;
}
message SetRegsResponse { OpStatus status = 1; }

message ThreadInfo {
  uint32 tid = 1;
  uint64 teb = 2;
  uint32 suspend_count = 3;
  uint64 start_address = 4;
}
message GetThreadsRequest {}
message GetThreadsResponse {
  OpStatus status = 1;
  repeated ThreadInfo threads = 2;
  uint32 current_tid = 3;
}

message StackFrame {
  uint64 frame = 1;
  uint64 return_address = 2;
  string symbol = 3;
  uint64 displacement = 4;
  string module = 5;
}
message StacktraceRequest {
  uint32 max_frames = 1; // default 32
}
message StacktraceResponse {
  OpStatus status = 1;
  repeated StackFrame frames = 2;
}

message MemoryRegionsRequest {
  uint32 pid = 1;
  int32 limit = 2;             // v9: 0 = no cap
  int32 offset = 3;
}
message MemoryRegion {
  uint64 base = 1;
  uint64 size = 2;
  uint32 state = 3;
  uint32 protect = 4;
  uint32 type = 5;
  string module = 6;
}
message MemoryRegionsResponse {
  OpStatus status = 1;
  repeated MemoryRegion regions = 2;
}

message DebugEvent {
  enum Kind {
    BREAKPOINT_SW = 0;
    BREAKPOINT_HW = 1;
    EXCEPTION = 2;
    PROCESS_EXIT = 3;
    THREAD_CREATE = 4;
    THREAD_EXIT = 5;
    MODULE_LOAD = 6;
    SESSION_STATUS = 7;
  }
  uint64 seq = 1;
  Kind kind = 2;
  uint32 tid = 3;
  uint64 address = 4;
  int32 exception_code = 5;
  string description = 6;
  uint64 timestamp_unix = 7;
  uint32 pid = 8;   // v12: owning process (single-session, but explicit)
}

message LaunchRequest {
  string cmdline = 1;
  string working_dir = 2;
  bool break_on_entry = 3;  // initial breakpoint event
  uint32 addr_width = 4;
}
message LaunchResponse {
  OpStatus status = 1;
  uint32 pid = 2;
  uint32 initial_tid = 3;
}

message AttachRequest {
  uint32 pid = 1;
  bool monitor = 2; // auto-resume bp/exception hits instead of staying
                    // stopped — passive-observation mode (bp_manage events)
}
message DetachRequest {
  bool kill = 1; // false: detach cleanly, true: terminate
}
message ContinueRequest {}
message DebugReadRequest {
  uint64 address = 1;
  uint64 size = 2;
}
message DebugReadResponse {
  OpStatus status = 1;
  bytes data = 2;
}
message DebugWriteRequest {
  uint64 address = 1;
  bytes data = 2;
}
message DebugWriteResponse { OpStatus status = 1; }

message StreamDebugEventsRequest {
  uint64 from_seq = 1;   // 0 = live from now; >0 replays buffered events first
}

message ExecuteCommandRequest {
  string command = 1;    // raw dbgeng command (e.g. "uf ntdll!NtCreateFile")
}
message ExecuteCommandResponse {
  OpStatus status = 1;
  string output = 2;
}

service Debug {
  rpc Launch(LaunchRequest) returns (LaunchResponse);
  rpc Attach(AttachRequest) returns (OpStatus);
  rpc Detach(DetachRequest) returns (OpStatus);
  rpc Continue(ContinueRequest) returns (OpStatus);
  rpc Step(StepRequest) returns (StepResponse);
  rpc GetRegs(GetRegsRequest) returns (GetRegsResponse);
  rpc SetRegs(SetRegsRequest) returns (SetRegsResponse);
  rpc GetThreads(GetThreadsRequest) returns (GetThreadsResponse);
  rpc Stacktrace(StacktraceRequest) returns (StacktraceResponse);
  rpc ReadMemory(DebugReadRequest) returns (DebugReadResponse);
  rpc WriteMemory(DebugWriteRequest) returns (DebugWriteResponse);
  rpc Regions(MemoryRegionsRequest) returns (MemoryRegionsResponse);
  rpc StreamEvents(StreamDebugEventsRequest) returns (stream DebugEvent);
  rpc ExecuteCommand(ExecuteCommandRequest) returns (ExecuteCommandResponse);
}

//                                                            Breakpoints ----

message BpAddRequest {
  enum Kind {
    SW = 0;   // int3 via debug engine
    HW = 1;   // DR0-3 via driver (kernel targets) or dbgeng data bp (user)
  }
  Kind kind = 1;
  uint64 address = 2;
  uint32 slot = 3;         // HW: 0-3
  uint32 size = 4;         // HW: 1,2,4,8
  string access = 5;       // HW: "exec", "write", "rw"
  bool kernel_target = 6;  // v0.9+: display hint only. HW BPs always go
                           // through the driver — kernel_target is kept
                           // for backward compat + bp_list annotation.
  uint32 tid = 7;          // HW: 0 = all threads of process (or all threads
                           // system-wide when global=true)
  uint32 pid = 8;          // HW: owning process (ignored when global=true)
  bool global = 9;         // v6+: system-wide HW BP. Arms every thread of
                           // every process + PsSetCreateThreadNotifyRoutine
                           // catches newborns regardless of parent pid. Driver
                           // caps concurrent global BPs at 2.
  bool dangerous_ok = 10;  // v6+: bypass the PatchGuard-expected refusal
                           // (lab-only, PG-defanged VMs). Ignored unless
                           // global=true.
  bool via_debugger = 11;  // v12: route an HW bp through the dbgeng
                           // debug port (AddBreakpoint2/DATA) instead of
                           // the driver — used by the bp-events debug-port
                           // fallback on hypervisor guests. Requires an
                           // attached session on `pid`.
}
message BpAddResponse {
  OpStatus status = 1;
  uint32 bp_id = 2;
}
message BpRemoveRequest { uint32 bp_id = 1; }
message BpListRequest {}
message BpEntry {
  uint32 bp_id = 1;
  string kind = 2;
  uint64 address = 3;
  uint32 slot = 4;
  string access = 5;
  bool enabled = 6;
  string description = 7;
  uint32 pid = 8;   // v12: driver-side bps carry their scope
  uint32 tid = 9;
  uint32 size = 10;
}
message BpListResponse {
  OpStatus status = 1;
  repeated BpEntry breakpoints = 2;
}
message BpSetEnabledRequest {
  uint32 bp_id = 1;
  bool enabled = 2;
}

service Breakpoints {
  rpc Add(BpAddRequest) returns (BpAddResponse);
  rpc Remove(BpRemoveRequest) returns (OpStatus);
  rpc List(BpListRequest) returns (BpListResponse);
  rpc SetEnabled(BpSetEnabledRequest) returns (OpStatus);
}

// ----------------------------------------------------------------- Files ----

message UploadHeader {
  string path = 1;
  uint64 size = 2;
}
message UploadChunk {
  oneof payload {
    UploadHeader header = 1;
    bytes data = 2;
  }
}
message UploadResponse {
  OpStatus status = 1;
  string path = 2;
  string sha256 = 3;
  uint64 bytes_written = 4;
}

message DumpedSection {
  string name = 1;        // section name (8-byte field, NUL-padded)
  uint64 va = 2;          // section RVA within the image
  uint64 size = 3;        // virtual size
  uint64 dumped_bytes = 4; // bytes actually read; the tail reads as zeros
  bool complete = 5;
}

message DownloadHeader {
  uint64 size = 1;
  string sha256 = 2;
  string notes = 3;     // dump metadata / repair notes
  repeated DumpedSection sections = 4; // v0.24: per-section residency map
  // v14: content came from a VSS shadow copy because the live file is
  // share-mode-0 locked. Bytes are a point-in-time snapshot, not the live
  // file — the caller should expect staleness vs. concurrent writers.
  bool via_snapshot = 5;
}
message DownloadChunk {
  oneof payload {
    DownloadHeader header = 1;
    bytes data = 2;
  }
}
message DownloadRequest {
  string path = 1;
  uint64 offset = 2;   // default 0
  uint64 length = 3;   // 0 = to EOF
}
message DumpModuleRequest {
  uint32 pid = 1;
  string module = 2;   // name or full path
  bool quiesce = 3;    // suspend target around the dump for a consistent image
  string dump_type = 4; // "as_loaded" (default) | "unrelocated" (reverse relocs)
  bool kernel = 5;      // dump a kernel module from the PsLoadedModuleList view;
                        // pid ignored, quiesce skipped. Discarded PAGE/INIT
                        // sections read back as zeros.
}
message HashRequest { string path = 1; }
message HashResponse {
  OpStatus status = 1;
  string sha256 = 2;
  uint64 size = 3;
  // v14: hashed a VSS shadow copy (share-mode-0 locked live file). Digest is
  // of the snapshot, which can differ from the live file's final bytes.
  bool via_snapshot = 4;
}
message ListDirRequest {
  string path = 1;
  bool recursive = 2;
  uint32 max_entries = 3;
}
message DirEntry {
  string name = 1;
  bool dir = 2;
  uint64 size = 3;
  uint64 mtime_unix = 4;
}
message ListDirResponse {
  OpStatus status = 1;
  repeated DirEntry entries = 2;
}
message DeleteRequest {
  string path = 1;
  bool no_trash = 2; // default: move to agent trash dir; true = hard delete
}

// v7: agent-local file tail. Fixes the "234 MB kernel log pull" pattern —
// the agent opens the file with FILE_SHARE_READ|WRITE|DELETE, seeks from
// end, reads up to `bytes` (server caps at 4 MiB per call), and returns
// only the tail. When `line_align=true` the first partial line is stripped
// so the response is line-clean. include_rotated=true also stitches in the
// tail of <path>.old (see agent kernel-log rotation) with a marker.
message LogTailRequest {
  string path = 1;
  uint32 bytes = 2;           // 0 = 64 KiB default; server caps at 4 MiB
  bool from_end = 3;          // default true; false = read [0..bytes] from the start
  bool line_align = 4;        // strip partial first line so response is line-clean
  bool include_rotated = 5;   // also fetch and stitch <path>.old
}
message LogTailResponse {
  OpStatus status = 1;
  bytes data = 2;
  uint64 total_size = 3;      // total file size at read time
  uint64 tail_offset = 4;     // where the tail starts in the file
  bool truncated = 5;         // true when total_size > bytes returned
  uint64 rotated_size = 6;    // size of <path>.old when include_rotated=true
  // v14: tail read through a VSS shadow copy (share-mode-0 locked file).
  // total_size is the snapshot size; the live file may already be larger.
  bool via_snapshot = 7;
}

// v8: server-streaming `tail -f` — the agent opens the file (same share
// flags as LogTail) and pushes chunks as they land. Kills the "wedge lost
// the verdict" pattern: writes-per-line to disk survive the wedge, the
// stream lets the orchestrator SEE them without any polling. Rotation is
// detected on size shrink and reported via `rotated=true` chunks.
// Concurrency-capped agent-side by SUSPX_MAX_FOLLOWS (default 8).
message LogFollowRequest {
  string path = 1;
  uint64 from_offset = 2;         // 0 = start of file, UINT64_MAX = start at EOF
  uint32 initial_tail_bytes = 3;  // when from_offset==0: seek back this many bytes
                                  //   before starting the follow (0 = start at 0)
  uint32 poll_interval_ms = 4;    // 0 = 200 ms default; floor at 10 ms
  uint32 max_chunk_bytes = 5;     // 0 = 64 KiB default; capped at 4 MiB
  bool line_align = 6;            // trim to last '\n' each chunk
  bool follow_rotation = 7;       // reopen path when size shrinks
  uint32 duration_s = 8;          // 0 = 600 s default; hard cap 3600 s
  uint64 max_bytes = 9;           // 0 = unlimited within duration
}
message LogFollowChunk {
  OpStatus status = 1;    // set on the first message; and on any terminal chunk
  uint64 offset = 2;      // absolute file offset of this chunk's first byte
  bytes data = 3;
  bool rotated = 4;       // true = reopened after a rotation (data may be empty)
  uint64 new_total_size = 5;  // file size after this chunk (0 if unknown)
  bool eof = 6;
  string reason = 7;      // eof=true: duration|max_bytes|cancelled|io_error|
                          //           path_gone|agent_shutdown|cap
  // v14: stat-follow degrade. true = the file can't be opened for content
  // (share-mode-0 lock) — this chunk reports a metadata change only
  // (size/mtime via GetFileAttributesExW); `data` is empty and `offset`
  // stays pinned. The follow keeps retrying the real open and returns to
  // data chunks the moment the lock clears.
  bool stat_only = 8;
}

service Files {
  rpc Upload(stream UploadChunk) returns (UploadResponse);
  rpc Download(DownloadRequest) returns (stream DownloadChunk);
  rpc DumpModule(DumpModuleRequest) returns (stream DownloadChunk);
  rpc Hash(HashRequest) returns (HashResponse);
  rpc ListDir(ListDirRequest) returns (ListDirResponse);
  rpc Delete(DeleteRequest) returns (OpStatus);
  rpc LogTail(LogTailRequest) returns (LogTailResponse);        // v7
  rpc LogFollow(LogFollowRequest) returns (stream LogFollowChunk); // v8
}

// ------------------------------------------------------------------ Exec ----

enum ShellKind {
  CMD = 0;
  POWERSHELL = 1;
}

message RunExeRequest {
  string exe = 1;
  repeated string args = 2;
  string working_dir = 3;
  uint64 timeout_ms = 4;      // 0 = 30s default
  bool hidden_window = 5;     // default true
}
message RunExeResponse {
  OpStatus status = 1;
  uint32 exit_code = 2;
  bytes stdout_data = 3;
  bytes stderr_data = 4;
  uint64 timed_out = 5;
  // v7: true when the agent had to kill the child on timeout. stdout_data
  // / stderr_data still carry whatever flushed before the kill.
  bool killed = 6;
}

message RunShellRequest {
  ShellKind shell = 1;
  string command = 2;
  string working_dir = 3;
  uint64 timeout_ms = 4;
  // v1.0.1 Phase 2.3: base64-of-UTF-16LE command, spawned as
  // ``powershell -EncodedCommand <b64>``. Immune to the double-parse
  // mangling that bites ``-Command <quoted>`` on embedded quotes,
  // backticks, newlines, and non-ASCII. Agent prefers encoded_command
  // over command when both are set and shell==POWERSHELL. Empty on
  // callers that predate this field.
  string encoded_command = 5;
}
message RunShellResponse {
  OpStatus status = 1;
  uint32 exit_code = 2;
  bytes output = 3;
}

message StartShellRequest {
  ShellKind shell = 1;
  string working_dir = 2;
}
message StartShellResponse {
  OpStatus status = 1;
  uint32 session_id = 2;
}
message WriteConsoleRequest {
  uint32 session_id = 1;
  bytes input = 2;
}
message ReadConsoleRequest {
  uint32 session_id = 1;
  uint64 max_bytes = 2;
  uint64 timeout_ms = 3;
}
message ConsoleData {
  OpStatus status = 1;
  bytes data = 2;
  bool eof = 3;
  uint32 session_id = 4;
}
message ShellSessionRequest { uint32 session_id = 1; }
message StreamConsoleRequest { uint32 session_id = 1; }

message KillProcessRequest { uint32 pid = 1; }
message PidRequest { uint32 pid = 1; }

// v7: first-class detached execution. Spawns with CREATE_NEW_PROCESS_GROUP;
// stdout/stderr redirected to per-handle files under
// %ProgramData%\suspex\detached\<handle_id>\{stdout,stderr}.log unless
// overridden. Returns immediately with a handle for poll/tail/kill.
message RunDetachedRequest {
  string cmdline = 1;
  string working_dir = 2;
  string stdout_path = 3;      // empty = default under ProgramData
  string stderr_path = 4;
  bool hidden_window = 5;      // default true
}
message RunDetachedResponse {
  OpStatus status = 1;
  string handle_id = 2;        // 24-char hex, agent-generated
  uint32 pid = 3;
  string stdout_path = 4;      // absolute path chosen by the agent
  string stderr_path = 5;
  uint64 started_ts = 6;       // unix millis
}
message DetachedHandleRequest { string handle_id = 1; }
message DetachedStatusResponse {
  OpStatus status = 1;
  bool running = 2;
  uint32 exit_code = 3;        // valid when running=false
  uint64 stdout_size = 4;
  uint64 stderr_size = 5;
  uint64 exited_ts = 6;        // unix millis, 0 while running
  string stdout_path = 7;
  string stderr_path = 8;
  uint32 pid = 9;
}
message DetachedTailRequest {
  string handle_id = 1;
  uint32 bytes = 2;            // 0 = 64 KiB default
  bool stderr_too = 3;         // include stderr tail
}
message DetachedTailResponse {
  OpStatus status = 1;
  bytes stdout_tail = 2;
  bytes stderr_tail = 3;
  uint64 stdout_total = 4;
  uint64 stderr_total = 5;
}

// v14: enumerate live shell session ids — a caller that lost track (or hit
// a transport arg-marshaling bug that delivered session_id=0) can recover
// without spawning a new shell.
message ListShellsRequest {}
message ListShellsResponse {
  OpStatus status = 1;
  repeated uint32 session_ids = 2;
}

// v15: Exec.CallFunction — synchronous in-context function call. CALL_USER
// injects a param-block trampoline + remote thread in pid; CALL_KERNEL runs
// Target inside a driver work item at PASSIVE_LEVEL. Both return rax plus
// failure detail. Gated by security.allow_function_call (default off) — this
// is the strongest actuator in the stack.
enum CallSpace {
  CALL_USER = 0;
  CALL_KERNEL = 1;
}

message CallFunctionRequest {
  uint64 pid = 1;                 // CALL_USER only (ignored for CALL_KERNEL)
  uint64 target_va = 2;           // function VA in the call's space
  repeated fixed64 args = 3;      // ms64 order; <= 16 (4 regs + 12 stack)
  CallSpace space = 4;
  uint32 timeout_ms = 5;          // 0 = 30 s default
  uint32 flags = 6;               // bit0 kill_on_timeout (user);
                                  // bit1 force (kernel: skip VA checks)
}
message CallFunctionResponse {
  OpStatus status = 1;            // transport-level op result (arg errors etc.)
  uint64 return_value = 2;        // rax / function return
  uint32 last_error = 3;          // user: TEB LastErrorValue post-call
  uint64 exit_code = 4;           // user: thread exit code (NTSTATUS when crashed)
  bool timed_out = 5;
  bool exception = 6;             // kernel: SEH caught; user: exit_code in error range
  uint64 exception_code = 7;
  uint64 thread_tid = 8;          // user: spawned tid (post-timeout inspection)
  uint64 stub_va = 9;             // user: stub+param page (cleanup on timeout)
}

service Exec {
  rpc RunExe(RunExeRequest) returns (RunExeResponse);
  rpc RunShell(RunShellRequest) returns (RunShellResponse);
  rpc StartShell(StartShellRequest) returns (StartShellResponse);
  rpc ConsoleWrite(WriteConsoleRequest) returns (OpStatus);
  rpc ConsoleRead(ReadConsoleRequest) returns (ConsoleData);
  rpc StopShell(ShellSessionRequest) returns (OpStatus);
  rpc StreamConsole(StreamConsoleRequest) returns (stream ConsoleData);
  rpc ListShells(ListShellsRequest) returns (ListShellsResponse); // v14
  rpc KillProcess(KillProcessRequest) returns (OpStatus);
  rpc Suspend(PidRequest) returns (OpStatus); // NtSuspendProcess (target quiescence)
  rpc Resume(PidRequest) returns (OpStatus);  // NtResumeProcess
  // v15: synchronous in-context function call (remote thread for CALL_USER,
  // driver work item for CALL_KERNEL). Gated by security.allow_function_call.
  rpc CallFunction(CallFunctionRequest) returns (CallFunctionResponse);
  // v7: detached execution family — see RunDetachedRequest above.
  rpc RunDetached(RunDetachedRequest) returns (RunDetachedResponse);
  rpc DetachedStatus(DetachedHandleRequest) returns (DetachedStatusResponse);
  rpc DetachedTail(DetachedTailRequest) returns (DetachedTailResponse);
  rpc DetachedKill(DetachedHandleRequest) returns (OpStatus);
}

// ---------------------------------------------------------------- Registry ----
//
// User-mode wrapper over the standard Reg* API. Runs in the agent (SYSTEM
// context when the agent is a service; otherwise the agent's user token).
// hive = HKLM | HKCU | HKCR | HKU | HKCC.
// wow64_32 = true opens the 32-bit view (KEY_WOW64_32KEY); otherwise the
// native view is used.

// v5: impersonation of another user's hive (needs the SuspexAgent to run
// as SYSTEM or hold SeImpersonatePrivilege). Use "user_by_pid:<pid>" to
// pick up an interactively-logged user's token from any process they own,
// or "user_by_sid:<S-1-5-...>" to walk sessions for one matching the SID.
// Empty (default) = agent's own token (SYSTEM under the service).

message RegGetRequest {
  string hive = 1;
  string subkey = 2;
  string value = 3;
  bool wow64_32 = 4;
  string impersonate = 5;  // "" | "user_by_pid:<pid>" | "user_by_sid:<sid>"
}
message RegGetResponse {
  OpStatus status = 1;
  uint32 type = 2;       // REG_SZ=1, REG_EXPAND_SZ=2, REG_BINARY=3, REG_DWORD=4, REG_QWORD=11, REG_MULTI_SZ=7 ...
  bytes data = 3;        // raw bytes as returned by RegQueryValueExW
  string data_str = 4;   // decoded UTF-16LE for REG_SZ / REG_EXPAND_SZ / (first item of) REG_MULTI_SZ
  uint64 data_qword = 5; // decoded for REG_DWORD (32-bit widened) / REG_QWORD; else 0
  repeated string data_multi_sz = 6; // populated only for REG_MULTI_SZ
}
message RegSetRequest {
  string hive = 1;
  string subkey = 2;
  string value = 3;
  uint32 type = 4;
  bytes data = 5;
  bool wow64_32 = 6;
  bool create_subkey = 7; // RegCreateKeyEx vs RegOpenKeyEx
  string impersonate = 8;
}
message RegSetResponse { OpStatus status = 1; }
message RegEnumRequest {
  string hive = 1;
  string subkey = 2;
  bool wow64_32 = 3;
  bool want_subkeys = 4;
  bool want_values = 5;
  string impersonate = 6;
}
message RegValueMeta {
  string name = 1;
  uint32 type = 2;
  uint32 size = 3;
}
message RegEnumResponse {
  OpStatus status = 1;
  repeated string subkeys = 2;
  repeated RegValueMeta values = 3;
}
message RegDeleteRequest {
  string hive = 1;
  string subkey = 2;
  string value = 3;      // empty -> delete the subkey; non-empty -> delete just the value
  bool recursive = 4;    // subkey delete: recurse via SHDeleteKey semantics
  bool wow64_32 = 5;
  string impersonate = 6;
}
message RegDeleteResponse { OpStatus status = 1; }

service Registry {
  rpc Get(RegGetRequest) returns (RegGetResponse);
  rpc Set(RegSetRequest) returns (RegSetResponse);
  rpc Enum(RegEnumRequest) returns (RegEnumResponse);
  rpc Delete(RegDeleteRequest) returns (RegDeleteResponse);
}

// --------------------------------------------------------------- Watchdog ----
//
// v8: wedge → bugcheck watchdog. Arm registers an id + deadline; the driver's
// system thread KeBugCheckEx()'s when the deadline passes without a Kick. Use
// auto-kick from the orchestrator for continuous coverage during a session —
// any wedge in the LLM loop / harness turns into an analyzable dump instead
// of a silent hang. The four bug-check arguments (Id, DeadlineUs, LastKickUs,
// Cookie) make the dump self-identify as ours under `!analyze -v`.

message WdgArmRequest {
  uint32 id = 1;              // caller-chosen nonzero id
  uint32 deadline_ms = 2;     // 1..3_600_000
  uint32 bugcheck_code = 3;   // 0 = 0xE2 MANUALLY_INITIATED_CRASH
  uint32 flags = 4;           // 1 = replace existing entry with same id
  uint64 cookie = 5;          // opaque; echoed into the dump as arg4
  string label = 6;           // <= 31 chars; truncated server-side
}
message WdgArmResponse { OpStatus status = 1; }

message WdgKickRequest {
  uint32 id = 1;
  uint32 deadline_ms = 2;     // 0 = keep existing deadline; > 0 = reset to this
  uint64 cookie = 3;          // 0 = keep existing cookie
}
message WdgKickResponse {
  OpStatus status = 1;
  uint64 kick_count = 2;
  uint64 last_kick_us = 3;
  uint64 deadline_us = 4;     // absolute QPC-us after this kick
}

message WdgDisarmRequest { uint32 id = 1; }
message WdgListRequest {}

message WdgEntry {
  uint32 id = 1;
  uint32 bugcheck_code = 2;
  uint64 deadline_us = 3;     // absolute QPC-us
  uint64 last_kick_us = 4;
  uint64 kick_count = 5;
  uint64 cookie = 6;
  uint64 armed_us = 7;
  string label = 8;
  int64 remaining_ms = 9;     // signed; negative = overdue at read time
}
message WdgListResponse {
  OpStatus status = 1;
  repeated WdgEntry entries = 2;
  uint64 now_us = 3;          // driver's QPC-us at read time
}

service Watchdog {
  rpc Arm(WdgArmRequest) returns (WdgArmResponse);
  rpc Kick(WdgKickRequest) returns (WdgKickResponse);
  rpc Disarm(WdgDisarmRequest) returns (OpStatus);
  rpc List(WdgListRequest) returns (WdgListResponse);
}

// ============================================================================
// v0.20 (ABI v11): agent primitives round — hands (Device.Ioctl), eyes
// (Memory.ThreadList, Memory.ObjEnum), ears (Events stream), telemetry
// (Telemetry.Providers/Sessions). Device/Telemetry/ThreadList are
// usermode-only (no driver); ObjEnum and the Events feed are driver-backed.
// ============================================================================

// Device: send an arbitrary IOCTL to a device on the target. The agent runs
// as SYSTEM, so both DOS-style symlink paths and raw device-object paths
// are openable via NtCreateFile. SAFETY: this is an actuator — a bad IOCTL can
// bugcheck the target; the orchestrator gates it behind
// security.allow_ioctl_send (default false) and the destructive gate.
service Device {
  rpc Ioctl(DeviceIoctlRequest) returns (DeviceIoctlResponse);
}

message DeviceIoctlRequest {
  string device = 1;       // "\.\Name" symlink OR "\Device\Name" object path
  uint32 code = 2;         // CTL_CODE (must be >= 0x10000)
  bytes in_buffer = 3;     // input payload (may be empty)
  uint32 out_size = 4;     // output buffer size to allocate (agent caps it)
  uint32 timeout_ms = 5;   // 0 = agent default (10s)
}

message DeviceIoctlResponse {
  OpStatus status = 1;
  bytes out_buffer = 2;    // whatever the driver returned
  uint32 bytes_returned = 3;
  uint32 last_error = 4;   // Win32 error when the send itself failed
}

// Telemetry: read-only ETW inventory — "what telemetry exists / who is
// watching". Query only; starting trace sessions is out of scope (the
// Events feed covers the kernel-side notification need).
service Telemetry {
  rpc Providers(EtwProvidersRequest) returns (EtwProvidersResponse);
  rpc Sessions(EtwSessionsRequest) returns (EtwSessionsResponse);
}

message EtwProvidersRequest {
  string name_filter = 1;  // case-insensitive substring; empty = all
}
message EtwProviderInfo {
  string guid = 1;
  string name = 2;
}
message EtwProvidersResponse {
  OpStatus status = 1;
  repeated EtwProviderInfo providers = 2;
  uint32 count = 3;
  bool truncated = 4;
}
message EtwSessionsRequest {
  string name_filter = 1;
}
message EtwSessionInfo {
  string name = 1;         // logger session name
  uint64 logger_id = 2;
  uint32 buffers_written = 3;
  uint32 buffers_lost = 4;
  uint64 events_lost = 5;
  uint32 loggers = 6;      // providers attached (best effort)
}
message EtwSessionsResponse {
  OpStatus status = 1;
  repeated EtwSessionInfo sessions = 2;
  uint32 count = 3;
}

// Memory.ThreadList: per-thread inventory. Agent-side base path uses
// NtQuerySystemInformation(SystemProcessInformation) — works without the
// driver. The driver-side enrichment (ETHREAD Win32StartAddress etc.) rides
// the same RPC when the driver is up (kernel=true). (The Debug service's
// ThreadInfo covers attached-process threads; this is the system-wide view.)
message ThreadListRequest {
  uint32 pid = 1;          // 0 = every process
  bool kernel = 2;         // driver-backed walk when true (ABI v11 driver)
  // v14: capture a CONTEXT register frame per thread via
  // SuspendThread+GetThreadContext+ResumeThread — pure usermode, no driver,
  // no dbgeng attach (the "wedged process" snapshot path). Threads of the
  // agent itself are skipped.
  bool with_context = 3;
}
message SysThreadInfo {
  uint32 tid = 1;
  uint32 pid = 2;
  uint64 start_va = 3;     // thread start address (SystemThreadInformation)
  uint32 state = 4;        // KTHREAD_STATE
  uint32 wait_reason = 5;
  int32 base_priority = 6;
  uint64 win32_start_va = 7;   // driver-backed only; 0 when unavailable
  uint64 teb = 8;              // driver-backed only; 0 when unavailable
  // v14: populated only when with_context was set and the thread could be
  // opened+suspended (empty map otherwise). Keys are CONTEXT register
  // names (rip, rsp, rbp, rax..r15, eflags, segs).
  map<string, uint64> context_regs = 9;
}
message ThreadListResponse {
  OpStatus status = 1;
  repeated SysThreadInfo threads = 2;
  uint32 count = 3;
  bool truncated = 4;
  string source = 5;       // "agent" (NtQuerySystemInformation) | "driver"
}

// Memory.ObjEnum: kernel object-directory enumeration (\Device, \Driver,
// \FileSystem, \BaseNamedObjects, \Callback, \ObjectTypes). Driver-side uses
// ZwOpenDirectoryObject + ZwQueryDirectoryObject — version-proof, no struct
// offsets. Depth/entry caps are enforced driver-side.
message ObjEnumRequest {
  string path = 1;         // e.g. "\Device", "\Driver"; leading "\" required
  uint32 depth = 2;        // 1 = flat listing (cap 2)
  uint32 max_entries = 3;  // agent caps at 4096
}
message ObjEntry {
  string name = 1;
  string type = 2;         // object type name ("Device", "Driver", ...)
  // v1.0.1 Phase 3.1: body VA + type index resolved by walking the
  // OBJECT_DIRECTORY hash buckets (``ObpRootDirectoryObject`` ->
  // OBJECT_HEADER). Both are 0 when the driver fell back to the
  // address-less ZwQueryDirectoryObject path.
  uint64 address    = 3;
  uint32 type_index = 4;
  string source     = 5;   // "walk" | "zwquery"
}
message ObjEnumResponse {
  OpStatus status = 1;
  repeated ObjEntry entries = 2;
  uint32 count = 3;
  bool truncated = 4;
}

// Events: target-initiated kernel notifications (the "ears"). The driver
// registers PsSet{CreateProcess,CreateThread,LoadImage}NotifyRoutine and
// rings events into a bounded buffer; the agent drains it and streams to the
// orchestrator. The orchestrator holds the stream (MCP clients cannot) and
// re-serves via event_manage poll.
//
// v12 (ABI v11): kernel HW-BP hit observability. EVENTS_KIND_BP_HIT
// rides the same ring; subscribing the class installs the driver's
// per-CPU int1 (IDT vector 1) hook — PatchGuard-sensitive, refused under
// HVCI, and gated by `dangerous_ok` on the request (maps to
// SUSPEX_NOTIFY_FLAG_BP_HOOK_OK). Poll/Stream auto-subscribe the BP class
// when kinds_mask has bit (1<<6); hits surface on SuspexEvent
// address/dr6/bp_id/slot/access/irql fields.
service Events {
  rpc Stream(EventsStreamRequest) returns (stream EventsStreamChunk);
  rpc Poll(EventsPollRequest) returns (EventsPollResponse);
  rpc Stats(EventsStatsRequest) returns (EventsStatsResponse);
  rpc Disable(OpStatus) returns (OpStatus);   // v11: unregister notify callbacks
}
message SuspexEvent {
  OpStatus status = 1;
  uint64 seq = 2;          // monotonic per-boot driver sequence
  uint64 ts_ms = 3;        // agent-side unix ms when drained
  EventsKind kind = 4;
  uint32 pid = 5;
  uint32 parent_pid = 6;
  uint32 tid = 7;
  string image = 8;        // image/driver path (UTF-8, best effort)
  string cmdline = 9;      // process-create only (may be empty)
  bool dropped = 10;       // true when the driver ring overwrote events
  // ---- v12 BP_HIT payload (zero for other kinds) ----
  uint64 address = 11;     // faulting RIP
  uint64 dr6 = 12;         // raw DR6 at trap entry
  uint32 bp_id = 13;       // matched suspex bp id (0 = table lock skipped)
  uint32 slot = 14;        // DR slot 0-3 (0xFF = unresolved)
  uint32 access = 15;      // matched SUSPEX_HW_* (0=exec 1=write 2=rw)
  uint32 irql = 16;        // KeGetCurrentIrql() at hit
}
// kept separate from the message so adding kinds stays wire-compatible
enum EventsKind {
  EVENTS_KIND_UNSPECIFIED = 0;
  EVENTS_PROC_CREATE = 1;
  EVENTS_PROC_EXIT = 2;
  EVENTS_IMAGE_LOAD = 3;
  EVENTS_THREAD_CREATE = 4;
  EVENTS_THREAD_EXIT = 5;
  EVENTS_KIND_BP_HIT = 6;  // v12: kernel HW-BP hit (int1 hook)
}
message EventsStreamRequest {
  uint32 kinds_mask = 1;   // bitmask of (1 << EventsKind); 0 = all.
                         // NOTE: bit 6 (BP_HIT) additionally installs the
                         // int1 hook — see dangerous_ok.
  uint32 interval_ms = 2;  // drain interval, default 250
  uint32 duration_s = 3;   // 0 = until client cancels
  uint32 max_events = 4;   // 0 = unlimited (bounded by duration)
  bool dangerous_ok = 5;   // v12: consent for the IDT[1] hook when the
                           // mask includes BP_HIT (PatchGuard-sensitive,
                           // lab-only). Without it the BP class is refused.
}
message EventsStreamChunk {
  OpStatus status = 1;
  repeated SuspexEvent events = 2;
  uint64 dropped = 3;      // driver-side overwrite-oldest counter (cumulative)
  bool done = 4;
}
message EventsPollRequest {
  uint64 since_seq = 1;    // 0 = from the oldest buffered event
  uint32 max_events = 2;   // driver caps the drain
  uint32 kinds_mask = 3;   // v12: bitmask of (1 << EventsKind); 0 = all.
                         // Bit 6 auto-subscribes the BP class first
                         // (installs the int1 hook — needs dangerous_ok).
  bool dangerous_ok = 4;   // v12: consent for the IDT[1] hook install
}
message EventsPollResponse {
  OpStatus status = 1;
  repeated SuspexEvent events = 2;
  uint64 last_seq = 3;
  uint64 dropped = 4;      // overwrite-oldest counter (events lost forever)
  bool subscribed = 5;     // whether any notify class is enabled
  bool bp_hook = 6;        // v12: int1 hook installed (BP class registered)
}
message EventsStatsRequest {}
message EventsStatsResponse {
  OpStatus status = 1;
  uint64 buffered = 2;
  uint64 dropped = 3;
  uint64 seq = 4;          // highest seq issued
  bool proc_notify = 5;    // which callback classes are registered
  bool image_notify = 6;
  bool thread_notify = 7;
  bool bp_hook = 8;        // v12: int1 hook installed (BP class registered)
  uint64 bp_missed = 9;    // v12: hits consumed without a ring record
                         // (lock contention / teardown window)
}
